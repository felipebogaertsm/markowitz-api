[project]
name = "markowitz-api"
version = "0.1.0"
description = ""
authors = [{ name = "Felipe Bogaerts de Mattos", email = "me@felipebm.com" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "psycopg (>=3.2.9,<4.0.0)",
    "alembic (>=1.16.1,<2.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pyright = "^1.1.401"
ruff = "^0.11.12"
pytest = "^8.3.5"

[tool.ruff]
line-length = 79
indent-width = 4
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes errors
    "W",   # pyflakes warnings
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade (auto-modernise syntax)
    "B",   # flake8-bugbear (common bugs & nit-picks)
    "C4",  # flake8-comprehensions (list/dict/set comps)
    "A",   # flake8-builtins (shadowing Python built-ins)
    "RET", # flake8-return (explicit/implicit return checks)
    "SIM", # flake8-simplify (over-complex constructs)
    "ISC", # flake8-implicit-str-concat
    "S",   # bandit security rules
    "RUF", # Ruff-specific extras (e.g. `RUF100` – unused noqa)
]

[tool.ruff.lint.per-file-ignores]
# tests often need assert-rewrites, monkeypatches, etc.
"tests/**/*.py" = [
    "S101",
    "B",
    "RUF012",
] # ignore `assert`-use & bugbear dunders
# allow re-exported names to appear unused in package init
"src/markowitz_api/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
